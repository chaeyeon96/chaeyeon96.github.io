<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1316" viewBox="0 0 1000 1316" role="img" aria-labelledby="title desc">
  <title id="title">GPS virtual screening: from compound library to experimental hit</title>
  <desc id="desc">ZINC drug-like and in-stock compounds, 6,857,774 as of June 2020, are ranked using GPS predictions and Z-RGES. Unwanted gene effects are penalized to obtain the top 2,000 candidates. Structure clustering selects representatives, and comparison with ChEMBL removes compounds similar to known anti-HCC compounds. Eighteen compounds are purchased and tested in HepG2, Hep3B, and Huh7. Approximately one third inhibit all three cell lines. PB56874852 is a selected hit with IC50 around 4 micromolar and high selectivity.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#8d9bb0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: 'Segoe UI', 'Malgun Gothic', Arial, sans-serif; }
      .eyebrow { font-size: 16px; font-weight: 600; letter-spacing: 1.7px; fill: #738096; }
      .tag { font-size: 15px; font-weight: 700; letter-spacing: 1.5px; }
      .card-title { font-size: 28px; font-weight: 650; fill: #25334b; }
      .body { font-size: 22px; fill: #56657d; }
      .number { font-size: 19px; font-weight: 700; text-anchor: middle; }
      .count { font-size: 43px; font-weight: 700; text-anchor: end; }
      .count-label { font-size: 19px; fill: #65738a; text-anchor: end; }
      .connector { fill: none; stroke: #a1adbe; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1000" height="1316" rx="24" fill="#f5f7fb"/>
  <text x="48" y="48" class="eyebrow">GPS / CANDIDATE SCREENING</text>
  <text x="952" y="48" text-anchor="end" class="eyebrow" style="font-size:14px;letter-spacing:1px">XING ET AL. · CELL 2026</text>
  <text x="48" y="104" font-size="42" font-weight="700" fill="#20304a">From 6.86 million compounds to 18</text>
  <text x="48" y="145" font-size="21" fill="#65738a">Rank by disease reversal. Filter for diversity and novelty. Test in cells.</text>

  <!-- A single reading direction; quantities are shown only where known. -->
  <path d="M 78 272 V 376" class="connector"/>
  <path d="M 78 432 V 545" class="connector"/>
  <path d="M 78 601 V 743" class="connector"/>
  <path d="M 78 799 V 941" class="connector"/>
  <path d="M 78 997 V 1133" class="connector"/>

  <!-- 01 Library -->
  <circle cx="78" cy="246" r="23" fill="#dae6fb"/>
  <text x="78" y="253" class="number" fill="#4267aa">01</text>
  <rect x="120" y="184" width="832" height="124" rx="18" fill="#eef3fc" stroke="#b3c5e5" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="152" y="216" class="tag" fill="#5876ab">STARTING LIBRARY</text>
  <text x="152" y="251" class="card-title">ZINC</text>
  <text x="152" y="283" class="body">Drug-like + in-stock · June 2020</text>
  <text x="920" y="255" class="count" fill="#4267aa">6,857,774</text>
  <text x="920" y="284" class="count-label">compounds</text>

  <!-- 02 Prediction and ranking -->
  <circle cx="78" cy="406" r="23" fill="#d3ebe2"/>
  <text x="78" y="413" class="number" fill="#347960">02</text>
  <rect x="120" y="344" width="832" height="124" rx="18" fill="#ffffff" stroke="#dce3ed" stroke-width="1.5"/>
  <text x="152" y="376" class="tag" fill="#44866e">PREDICTION + RANKING</text>
  <text x="152" y="411" class="card-title">GPS prediction + Z-RGES</text>
  <text x="152" y="443" class="body">Rank compounds by predicted disease reversal</text>

  <!-- 03 Penalty and top candidates -->
  <circle cx="78" cy="575" r="23" fill="#f2e2c5"/>
  <text x="78" y="582" class="number" fill="#977033">03</text>
  <rect x="120" y="504" width="832" height="142" rx="18" fill="#fcf5e9" stroke="#efdfc4" stroke-width="1.5"/>
  <text x="152" y="536" class="tag" fill="#99743e">FILTERING</text>
  <text x="152" y="571" class="card-title">Penalty-adjusted shortlist</text>
  <text x="152" y="604" class="body">Penalize unwanted gene effects</text>
  <text x="152" y="630" font-size="19" fill="#7d6b52">e.g. further up-regulating HCC-up genes</text>
  <text x="920" y="578" class="count" fill="#977033">2,000</text>
  <text x="920" y="608" class="count-label">top candidates</text>

  <!-- 04 Diversity and novelty -->
  <circle cx="78" cy="773" r="23" fill="#f2e2c5"/>
  <text x="78" y="780" class="number" fill="#977033">04</text>
  <rect x="120" y="682" width="832" height="182" rx="18" fill="#ffffff" stroke="#dce3ed" stroke-width="1.5"/>
  <text x="152" y="714" class="tag" fill="#99743e">DIVERSITY + NOVELTY</text>
  <text x="152" y="750" font-size="25" font-weight="650" fill="#25334b">Structure clustering</text>
  <text x="152" y="786" class="body">Choose representative</text>
  <text x="152" y="816" class="body">compounds from clusters</text>
  <path d="M 540 736 V 835" fill="none" stroke="#e2e7ef" stroke-width="1.5"/>
  <text x="576" y="750" font-size="25" font-weight="650" fill="#25334b">ChEMBL comparison</text>
  <text x="576" y="786" class="body">Exclude similarity to known</text>
  <text x="576" y="816" class="body">anti-HCC compounds</text>

  <!-- 05 Experimental validation -->
  <circle cx="78" cy="971" r="23" fill="#e5daf5"/>
  <text x="78" y="978" class="number" fill="#7a58a3">05</text>
  <rect x="120" y="900" width="832" height="142" rx="18" fill="#f3effa" stroke="#e2d9f1" stroke-width="1.5"/>
  <text x="152" y="932" class="tag" fill="#8260a8">EXPERIMENTAL VALIDATION</text>
  <text x="152" y="969" class="card-title">Purchase + cell assays</text>
  <text x="152" y="1003" class="body">HepG2 · Hep3B · Huh7</text>
  <text x="920" y="973" class="count" fill="#7a58a3">18</text>
  <text x="920" y="1004" class="count-label">compounds tested</text>

  <!-- 06 Results -->
  <circle cx="78" cy="1163" r="23" fill="#e5daf5"/>
  <text x="78" y="1170" class="number" fill="#7a58a3">06</text>
  <rect x="120" y="1078" width="832" height="170" rx="18" fill="#ffffff" stroke="#cbb9e3" stroke-width="1.8"/>
  <text x="152" y="1110" class="tag" fill="#8260a8">EXPERIMENTAL HITS</text>
  <text x="152" y="1146" class="card-title">~1/3 inhibited all three cell lines</text>
  <path d="M 152 1166 H 920" fill="none" stroke="#e7e0ef" stroke-width="1.5"/>
  <text x="152" y="1205" font-size="31" font-weight="700" fill="#74529b">PB56874852</text>
  <text x="152" y="1231" font-size="19" fill="#65738a">Selected hit · high selectivity</text>
  <text x="920" y="1205" text-anchor="end" font-size="29" font-weight="650" fill="#74529b">IC<tspan baseline-shift="sub" font-size="19">50</tspan><tspan baseline-shift="baseline"> ≈ 4 μM</tspan></text>

  <text x="48" y="1291" font-size="17" fill="#7e899b">Illustrative workflow · HCC screening</text>
  <text x="952" y="1291" text-anchor="end" font-size="17" fill="#7e899b">GPS Pipeline · Section 6</text>
</svg>
