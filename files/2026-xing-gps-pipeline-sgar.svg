<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1260" viewBox="0 0 1120 1260" role="img" aria-labelledby="title desc">
  <title id="title">SGAR: associate predicted gene regulation with measured compound activity</title>
  <desc id="desc">For the same 26 compounds, GPS predicts gene regulation from structure, while experiments provide IC50 values averaged across Huh7, HepG2, and Hep3B. For each gene, predicted regulation defines compound groups, and their measured IC50 values are compared with a rank-sum test. Predicted down versus other predictions is an illustrative contrast; exact grouping details are marked as inferred in the note. The analysis identifies 15 activity-associated genes, including UHRF1, followed by experimental validation. Association does not establish direct compound binding to the protein.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#8d9bb0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: 'Segoe UI', 'Malgun Gothic', Arial, sans-serif; }
      .eyebrow { font-size: 16px; font-weight: 600; letter-spacing: 1.7px; fill: #738096; }
      .tag { font-size: 15px; font-weight: 700; letter-spacing: 1.3px; }
      .card-title { font-size: 28px; font-weight: 700; fill: #25334b; }
      .body { font-size: 22px; fill: #56657d; }
      .line { fill: none; stroke: #a1adbe; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .arrow { marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1120" height="1260" rx="24" fill="#f5f7fb"/>
  <text x="48" y="48" class="eyebrow">GPS / STRUCTURE–GENE–ACTIVITY RELATIONSHIP</text>
  <text x="1072" y="48" text-anchor="end" class="eyebrow" style="font-size:14px;letter-spacing:1px">XING ET AL. · CELL 2026</text>
  <text x="48" y="104" font-size="42" font-weight="700" fill="#20304a">SGAR: link gene regulation to activity</text>
  <text x="48" y="145" class="body">Match GPS predictions to measured IC50 for the same compounds.</text>

  <!-- Shared compound identifiers connect prediction and measurement. -->
  <rect x="352" y="184" width="416" height="96" rx="18" fill="#ffffff" stroke="#b5c2d5" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="560" y="216" text-anchor="middle" class="tag" fill="#65738a">SHARED COMPOUND SET</text>
  <text x="560" y="254" text-anchor="middle" font-size="31" font-weight="700" fill="#25334b">26 compounds</text>
  <path d="M 560 280 V 304 H 302 Q 292 304 292 314 V 338" class="line arrow"/>
  <path d="M 560 304 H 818 Q 828 304 828 314 V 338" class="line arrow"/>

  <!-- Predicted gene regulation is separate from experimentally measured activity. -->
  <rect x="48" y="346" width="488" height="196" rx="20" fill="#eef3fc" stroke="#d9e4f6" stroke-width="1.5"/>
  <text x="80" y="381" class="tag" fill="#5876ab">PREDICTED GENE REGULATION</text>
  <text x="80" y="424" class="card-title">GPS expression prediction</text>
  <text x="80" y="464" class="body">For each gene: up / none / down</text>
  <text x="80" y="502" font-size="21" fill="#58729c">Structure → predicted regulation</text>

  <rect x="584" y="346" width="488" height="196" rx="20" fill="#edf7f4" stroke="#d5e9e2" stroke-width="1.5"/>
  <text x="616" y="381" class="tag" fill="#44866e">MEASURED COMPOUND ACTIVITY</text>
  <text x="616" y="424" class="card-title">Experimental IC50</text>
  <text x="616" y="464" class="body">Huh7 · HepG2 · Hep3B</text>
  <text x="616" y="502" font-size="21" fill="#52796a">Mean IC50 per compound</text>

  <!-- Both inputs enter a gene-by-gene comparison. -->
  <path d="M 292 542 V 570 Q 292 580 302 580 H 560" class="line"/>
  <path d="M 828 542 V 570 Q 828 580 818 580 H 560" class="line"/>
  <path d="M 560 580 V 618" class="line arrow"/>
  <text x="584" y="607" font-size="19" font-weight="600" fill="#738096">Repeat for each gene</text>

  <rect x="48" y="626" width="1024" height="300" rx="20" fill="#fcf5e9" stroke="#efdfc4" stroke-width="1.5"/>
  <text x="80" y="660" class="tag" fill="#99743e">GENE-BY-GENE ASSOCIATION</text>
  <text x="80" y="700" font-size="29" font-weight="700" fill="#25334b">Compare activity between prediction groups</text>

  <rect x="80" y="730" width="440" height="90" rx="14" fill="#ffffff" stroke="#e9d9be"/>
  <text x="300" y="764" text-anchor="middle" font-size="25" font-weight="650" fill="#866631">Predicted down</text>
  <text x="300" y="797" text-anchor="middle" font-size="21" fill="#65738a">IC50 values of these compounds</text>
  <rect x="600" y="730" width="440" height="90" rx="14" fill="#ffffff" stroke="#e9d9be"/>
  <text x="820" y="764" text-anchor="middle" font-size="25" font-weight="650" fill="#866631">Other predictions</text>
  <text x="820" y="797" text-anchor="middle" font-size="21" fill="#65738a">IC50 values of these compounds</text>

  <path d="M 300 820 V 835 H 560" class="line"/>
  <path d="M 820 820 V 835 H 560" class="line"/>
  <path d="M 560 835 V 850" class="line arrow"/>
  <rect x="340" y="854" width="440" height="44" rx="12" fill="#f2e2c5"/>
  <text x="560" y="883" text-anchor="middle" font-size="22" font-weight="650" fill="#866631">Rank-sum test on IC50 values</text>
  <text x="560" y="915" text-anchor="middle" font-size="17" fill="#8c7758">Illustrative group split; exact grouping details are inferred in the note.</text>

  <!-- Association candidates are followed by biological validation. -->
  <path d="M 560 926 V 944 Q 560 950 550 950 H 302 Q 292 950 292 960 V 970" class="line arrow"/>
  <rect x="48" y="978" width="488" height="164" rx="20" fill="#f3effa" stroke="#e2d9f1" stroke-width="1.5"/>
  <text x="80" y="1012" class="tag" fill="#8260a8">ASSOCIATION CANDIDATES</text>
  <text x="80" y="1054" font-size="26" font-weight="700" fill="#25334b">15 activity-associated genes</text>
  <text x="80" y="1098" font-size="25" font-weight="650" fill="#74529b">Includes UHRF1</text>

  <path d="M 544 1060 H 608" class="line arrow"/>
  <rect x="616" y="978" width="456" height="164" rx="20" fill="#ffffff" stroke="#cbb9e3" stroke-width="1.5"/>
  <text x="648" y="1012" class="tag" fill="#8260a8">EXPERIMENTAL FOLLOW-UP</text>
  <text x="648" y="1054" class="card-title">UHRF1 validation</text>
  <text x="648" y="1091" class="body">Knockdown · RNA-seq</text>
  <text x="648" y="1120" class="body">Protein measurements</text>

  <text x="560" y="1193" text-anchor="middle" font-size="21" fill="#65738a">Association does not establish direct compound–protein binding.</text>
  <text x="48" y="1232" font-size="17" fill="#7e899b">Illustrative workflow · prediction + experiment</text>
  <text x="1072" y="1232" text-anchor="end" font-size="17" fill="#7e899b">GPS Pipeline · Section 8</text>
</svg>
